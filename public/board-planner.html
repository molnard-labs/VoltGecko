<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Elosztó tervező</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8ebee; --panel:#f7f8f9; --ink:#1a2027; --ink2:#5b6671; --line:#cdd3d9;
  --accent:#1c5fd4; --accent-ink:#ffffff; --danger:#c2392d; --warn:#b36b00; --ok:#1d8a4a;
  --plate:#c9d0d6; --plate2:#b5bdc5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171b; --panel:#1c2228; --ink:#e6eaee; --ink2:#99a5b0; --line:#313a43;
    --accent:#6ba1ff; --accent-ink:#0a1220; --danger:#ff7a6e; --warn:#f0b24a; --ok:#52c98a;
    --plate:#39424a; --plate2:#2d353c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171b; --panel:#1c2228; --ink:#e6eaee; --ink2:#99a5b0; --line:#313a43;
  --accent:#6ba1ff; --accent-ink:#0a1220; --danger:#ff7a6e; --warn:#f0b24a; --ok:#52c98a;
  --plate:#39424a; --plate2:#2d353c;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.35 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.pname{flex:1;min-width:0;border:1px solid transparent;border-radius:6px;background:transparent;
  font:600 20px/1.2 'Barlow Condensed','Arial Narrow',sans-serif;padding:4px 6px;letter-spacing:.01em}
.pname:hover,.pname:focus{border-color:var(--line);outline:none;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;font-weight:500;white-space:nowrap;min-height:34px}
.btn:hover{background:var(--bg)}
.btn:focus-visible,.tab:focus-visible,.pal:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;padding:10px 6px;font:600 16px 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.02em;
  color:var(--ink2);border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
.palette{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;-webkit-overflow-scrolling:touch}
.pal{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:6px 8px 5px;min-width:76px;
  border:1px solid var(--line);background:var(--bg);border-radius:8px;font:500 13px/1.1 'Barlow Condensed','Arial Narrow',sans-serif;text-align:center}
.pal:active{background:var(--line)}
.pal svg{display:block}
.bar{display:flex;gap:6px;padding:6px 10px;overflow-x:auto;flex:0 0 auto;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
.bar .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.bar select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 6px;min-height:34px}
.hint{padding:5px 10px;font-size:13px;color:var(--ink2);flex:0 0 auto;min-height:28px;background:var(--bg)}
.hint b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.scroller{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.scroller svg{display:block}
.insp{flex:0 0 auto;max-height:46%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px 14px}
.insp[hidden]{display:none}
.insp h3{margin:0 0 8px;font:600 18px 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.01em;display:flex;gap:8px;align-items:baseline}
.insp h3 small{font:400 13px 'Barlow',sans-serif;color:var(--ink2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2);min-width:0}
.f select,.f input{font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--ink2)}
@media (min-width:900px){
  .stage{flex-direction:row}
  .insp{width:310px;max-height:none;border-top:0;border-left:1px solid var(--line)}
  .grid{grid-template-columns:1fr 1fr}
}
.sldpaper{background:#fff;display:inline-block;margin:10px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
#sldwrap{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 14px;border-radius:8px;font-size:14px;max-width:88vw;z-index:50;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.modal[hidden]{display:none}
.mcard{background:var(--panel);border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:16px;border:1px solid var(--line)}
.mcard h2{margin:0 0 10px;font:600 22px 'Barlow Condensed','Arial Narrow',sans-serif}
.mcard .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.issue{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.issue:first-of-type{border-top:0}
.issue i{font-style:normal;font-weight:700;min-width:54px}
.issue.err i{color:var(--danger)} .issue.warn i{color:var(--warn)} .issue.ok i{color:var(--ok)}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;font:12px/1.3 ui-monospace,monospace}
.dev{cursor:grab}
svg text{user-select:none;-webkit-user-select:none}
@media print{
  @page{size:A3 landscape;margin:8mm}
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  .top,.tabs,.bar,.hint,.toast,.modal,.palette,.insp{display:none!important}
  body:not(.pcab) #view-cab{display:none!important}
  body.pcab #view-sld{display:none!important}
  body.pcab #view-cab{display:block!important}
  #sldwrap,#cabwrap{padding:0!important;margin:0!important}
  .view{overflow:visible!important}
  body.pcab .stage{display:block!important;height:auto!important}
  body.pcab #cabwrap{overflow:visible!important;height:auto!important;background:#fff}
  body.pcab #cabwrap svg{width:var(--pw,100%)!important;height:var(--ph,auto)!important;display:block;margin:0 auto}
  body:not(.pcab) #view-sld{display:block!important}
  #sldwrap{overflow:visible;background:#fff}
  .sldpaper{display:block;margin:0;box-shadow:none}
  .sldpaper svg{width:var(--pw,100%)!important;height:var(--ph,auto)!important;display:block;margin:0 auto}
}
@media (prefers-reduced-motion:no-preference){.pal{transition:background .12s}}
</style>
</head>
<body>

<header class="top">
  <input id="pname" class="pname" aria-label="Projekt neve" autocomplete="off">
  <button class="btn" id="btn-undo" title="Visszavonás" aria-label="Visszavonás">↶</button>
  <button class="btn" id="btn-check">Ellenőrzés</button>
  <button class="btn" id="btn-proj">Projekt</button>
</header>
<nav class="tabs" role="tablist">
  <button class="tab on" role="tab" data-view="cab">Szekrény</button>
  <button class="tab" role="tab" data-view="sld">Egyvonalas rajz</button>
</nav>

<section class="view" id="view-cab">
  <div class="palette" id="palette" aria-label="Eszközök"></div>
  <div class="bar">
    <button class="btn" id="btn-rowadd">Sor +</button>
    <button class="btn" id="btn-rowdel">Sor −</button>
    <button class="btn" id="btn-boxadd" title="Új elosztó doboz (külön szekrény) hozzáadása">Doboz +</button>
    <button class="btn" id="btn-boxren" title="Az aktív sor dobozának átnevezése">Doboz neve</button>
    <select id="selmods" aria-label="Doboz szélessége (modul)" title="Az aktív doboz (az utoljára kijelölt eszköz dobozának) összes sorának szélessége, modulban">
      <option value="12">12 modul</option><option value="14">14 modul</option><option value="16">16 modul</option><option value="18">18 modul</option><option value="20">20 modul</option><option value="22">22 modul</option><option value="24">24 modul</option><option value="28">28 modul</option><option value="30">30 modul</option><option value="36">36 modul</option>
    </select>
    <span class="sep"></span>
    <button class="btn" id="btn-zout" aria-label="Kicsinyítés">−</button>
    <button class="btn" id="btn-zin" aria-label="Nagyítás">+</button>
    <button class="btn" id="btn-zfit">Illesztés</button>
    <span class="sep"></span>
    <button class="btn" id="btn-phase" title="Az egyfázisú áramkörök kiosztása L1/L2/L3 fázisra (a már kiosztottakat nem bántja)">Fázisok</button>
    <button class="btn" id="btn-cont" title="Egymás után több vezeték ugyanabból a pontból">Folyamatos bekötés</button>
    <span class="sep"></span>
    <button class="btn" id="btn-csvg" title="A szekrény nézet mentése SVG-ként">SVG</button>
    <button class="btn" id="btn-cpng" title="A szekrény nézet mentése PNG-ként">PNG</button>
    <button class="btn" id="btn-cprint" title="A szekrény nézet nyomtatása vagy mentése PDF-be">Nyomtatás / PDF</button>
    <select class="paper" aria-label="Papírméret az exportokhoz" title="Papírméret az exportokhoz (SVG, PNG, nyomtatás): a rajz egy lapra illesztve"></select>
  </div>
  <div class="hint" id="hint"></div>
  <div class="stage">
    <div class="scroller" id="cabwrap"></div>
    <aside class="insp" id="insp" hidden></aside>
  </div>
</section>

<section class="view" id="view-sld" hidden>
  <div class="bar">
    <button class="btn primary" id="btn-svg">SVG mentése</button>
    <button class="btn" id="btn-png">PNG mentése</button>
    <button class="btn" id="btn-print" title="Nyomtatás vagy mentés PDF-be a böngésző nyomtatási ablakán át">Nyomtatás / PDF</button>
    <select class="paper" aria-label="Papírméret az exportokhoz" title="Papírméret az exportokhoz (SVG, PNG, nyomtatás): a rajz egy lapra illesztve"></select>
    <span class="sep"></span>
    <button class="btn" id="btn-szout" aria-label="Kicsinyítés">−</button>
    <button class="btn" id="btn-szin" aria-label="Nagyítás">+</button>
    <button class="btn" id="btn-szfit">Illesztés</button>
  </div>
  <div class="hint" id="sldhint">A rajz a szekrény nézet bekötéseiből készül, és minden módosításnál frissül.</div>
  <div class="scroller" id="sldwrap"></div>
</section>

<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <h2 id="mtitle"></h2>
    <div id="mbody"></div>
    <div class="row"><button class="btn" id="mclose">Bezár</button></div>
  </div>
</div>
<input type="file" id="filein" accept=".json,application/json" hidden>
<input type="file" id="filekmsz" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';

/* ───────────── konstansok ───────────── */
const MOD_W = 34, DEV_H = 118, GAP = 62, LM = 84, RM = 44, TM0 = 64, BUS_H = 14;
const TERM_MODS = 29 / 17.5, TERM_W = MOD_W * TERM_MODS; /* főági sorkapocs: kapcsonként 29 mm */
const BOX_T = 20, BOX_END = 134;
const LAY = {top:[], base:[], last:[], end:[], lastTop:[], H:0};
const ROWP = DEV_H + GAP;
const STORE_KEY = 'eloszto-tervezo-v2';
const FONT_CAB = "'Barlow Condensed','Arial Narrow',Arial,sans-serif";

const POLES = {
  '1P':{m:1,ph:1,c:1}, '1P+N':{m:2,ph:1,c:2}, '2P':{m:2,ph:1,c:2},
  '3P':{m:3,ph:3,c:3}, '3P+N':{m:4,ph:3,c:4}, '4P':{m:4,ph:3,c:4}, '3P+N+PE':{m:4,ph:3,c:5}
};
const TYPES = {
  supply:   {label:'Betáplálás',          prefix:'T',   poles:['1P+N','3P+N'],              mods:{'1P+N':2,'3P+N':4}},
  main:     {label:'Főkapcsoló',          prefix:'Q',   poles:['2P','3P','4P']},
  mcb:      {label:'Kismegszakító',       prefix:'F',   poles:['1P','1P+N','3P','3P+N']},
  rccb:     {label:'ÁVK',                 prefix:'FI',  poles:['2P','4P']},
  rcbo:     {label:'ÁVK-kismegszakító',   prefix:'F',   poles:['1P+N','3P+N'],              mods:{'1P+N':2,'3P+N':4}},
  spd:      {label:'Túlfeszültség-védelem',prefix:'SPD',poles:['1P+N','3P+N'],              mods:{'1P+N':2,'3P+N':4}},
  contactor:{label:'Kontaktor',           prefix:'K',   poles:['2P','4P'],                  mods:{'2P':2,'4P':3}},
  meter:    {label:'Fogyasztásmérő',      prefix:'WH',  poles:['1P+N','3P+N'],              mods:{'1P+N':4,'3P+N':6}},
  terminal: {label:'Főági sorkapocs',     prefix:'X',   poles:['1P','1P+N','3P+N','3P+N+PE'], mods:{'1P':TERM_MODS,'1P+N':4,'3P+N':7,'3P+N+PE':9}},
  mpcb:     {label:'Motorvédő kapcsoló (MVK)', prefix:'MVK', poles:['1P+N','3P'],                mods:{'1P+N':2,'3P':3}},
  outlet:   {label:'Dugalj',              prefix:'XS',  poles:['1P+N'],                     mods:{'1P+N':2}},
  relay:    {label:'Okosrelé',            prefix:'KR',  poles:['1P+N'],                     mods:{'1P+N':1}},
  emrelay:  {label:'Mérős relé (clamp)',  prefix:'PM',  poles:['1P+N'],                     mods:{'1P+N':1}}
};
const DEF = {
  supply:   () => ({poles:'3P+N', name:'Betáplálás', cable:'NYY-J 5×16 mm²'}),
  main:     () => ({poles:'4P', rating:63, name:'Főkapcsoló', cable:''}),
  mcb:      () => ({poles:'1P', curve:'C', rating:16, name:'Új áramkör', cable:'Cu NYM-J 1×2,5 mm²', loadType:'socket', power:'', length:'', phase:''}),
  rccb:     () => ({poles:'4P', rating:40, sens:30, rtype:'A', name:'ÁVK', cable:''}),
  rcbo:     () => ({poles:'1P+N', curve:'C', rating:16, sens:30, rtype:'A', name:'Új áramkör', cable:'Cu NYM-J 1×2,5 mm²', loadType:'socket', power:'', length:'', phase:''}),
  spd:      () => ({poles:'3P+N', cls:'T1+T2', name:'Túlfeszültség-védelem', cable:''}),
  contactor:() => ({poles:'4P', rating:25, name:'Kontaktor', cable:'NYM-J 5×2,5 mm²', loadType:'motor', power:'', length:''}),
  meter:    () => ({poles:'3P+N', name:'Fogyasztásmérő', cable:''}),
  terminal: () => ({poles:'3P+N', name:'Főági sorkapocs', cable:''}),
  mpcb:     () => ({poles:'1P+N', rating:3.2, name:'Motorvédő kapcsoló', cable:'', loadType:'motor', power:'', length:''}),
  outlet:   () => ({poles:'1P+N', name:'Dugalj', cable:'', loadType:'socket', power:'', length:''}),
  relay:    () => ({poles:'1P+N', name:'Okosrelé', cable:''}),
  emrelay:  () => ({poles:'1P+N', name:'Shelly Pro EM-50 (2 clamp)', cable:''})
};
/* soroló sínek: N és PE a szekrény tetején (kapocskiosztás), soronként egy fázissín (L1-L3) a sor alatt */
const BUS = {
  n: {label:'N sín',  short:'N',  color:'#2d6fd3'},
  pe:{label:'PE sín', short:'PE', color:'#2f9e44', stripe:'#f2cf1d'}
};
const ROWBAR = {L1:'#7a4a1e', L2:'#2b2b2b', L3:'#8a8f95'};
const BUS_KEYS = Object.keys(BUS), BUS_SIZES = [6, 8, 10, 12, 16, 20, 24, 30, 36], BUS_DEF = 12, BUS_PITCH = 17;
const ROWBAR_DY = DEV_H + 8;
function newBox(name){ return {name:name || 'Elosztó', busPos:'top', bus:{n:0, pe:0}, bu:{n:[], pe:[]}}; }
/* N és PE sín: ha elférnek egymás mellett, egy sávban futnak, különben egymás alatt */
function busLay(b){
  const bx = S.boxes[b], on = BUS_KEYS.filter(k => bx.bus[k] > 0), wd = k => bx.bus[k] * BUS_PITCH + 16;
  const boxW = Math.max.apply(null, S.rows.filter(r => r.box === b).map(r => r.mods).concat([12])) * MOD_W + 16;
  const side = on.length === 2 && wd('n') + wd('pe') + 44 <= boxW;
  const bo = k => (bx.bo && bx.bo[k] && bx.bo[k].dx) || 0;
  return {on, side, bands:side ? 1 : on.length, x:{n:LM - 8 + bo('n'), pe:(side ? LM - 8 + wd('n') + 44 : LM - 8) + bo('pe')}, band:{n:0, pe:side ? 0 : on.indexOf('pe')}};
}
const busOn = b => busLay(b).on;
const busDy = (b, k) => { const o = S.boxes[b].bo && S.boxes[b].bo[k]; return (o && o.dy) || 0; };
const busY = (b, k) => (S.boxes[b].busPos === 'bottom' ? LAY.lastTop[b] + DEV_H + 64 + busLay(b).band[k] * BUS_H : LAY.base[b] + BOX_T + 6 + busLay(b).band[k] * BUS_H) + busDy(b, k);
const busDot = (b, k, i) => ({x:busLay(b).x[k] + 8 + (i + .5) * BUS_PITCH, y:busY(b, k) + 4.5});
const bwDot = w => { const c = byId(w.c); return c ? c.x + (Number.isInteger(w.p) ? w.p : Math.floor((mods(c) - 1) / 2)) : 0; };
/* a fázissín csak a rákötött KMSZ-ek hosszában fut; a férőhelyek száma (barN) megadható */
function barRange(ri){
  const r = S.rows[ri], ms = S.bw.filter(w => { const c = byId(w.c); return c && c.row === ri; }).map(bwDot);
  const lo = ms.length ? Math.min.apply(null, ms) : 0, hi = ms.length ? Math.max.apply(null, ms) : 0;
  const n = Math.min(r.mods, Math.max(Number(r.barN) || 0, ms.length ? hi - lo + 1 : 6));
  return {s:Math.max(0, Math.min(lo, r.mods - n)), n};
}
const rowBarSide = r => S.rows[r] && S.rows[r].barPos === 'top' ? 'top' : 'bottom'; // a fázissín a sor felett vagy alatt fut
const rowBarY = r => rowBarSide(r) === 'top' ? rowTop(r) - 18 : rowTop(r) + ROWBAR_DY;
const rowDot = (r, k) => ({x:LM + (k + .5) * MOD_W, y:rowBarY(r) + 4});
/* a dobozok egymás alatt: doboz fejléc (cím + N/PE sínek), majd a sorok */
function updLayout(){
  LAY.top = []; LAY.base = []; LAY.last = []; LAY.end = []; LAY.lastTop = [];
  const bottom = b => S.boxes[b].busPos === 'bottom', ext = b => bottom(b) ? busLay(b).bands * BUS_H + 24 : 0;
  let y = 0, prev = -1, last = 0;
  S.rows.forEach((r, i) => {
    if (r.box !== prev) {
      if (prev >= 0) { LAY.lastTop[prev] = last; LAY.end[prev] = last + DEV_H + 112 + ext(prev); y = last + DEV_H + BOX_END + ext(prev); }
      LAY.base[r.box] = y; y += BOX_T + TM0 + (bottom(r.box) ? 0 : busLay(r.box).bands * BUS_H); last = y; LAY.top[i] = y; prev = r.box;
    } else { last += ROWP; LAY.top[i] = last; }
  });
  if (prev >= 0) { LAY.lastTop[prev] = last; LAY.end[prev] = last + DEV_H + 112 + ext(prev); }
  LAY.H = last + DEV_H + Math.max(GAP - 6, 112 + 12) + (prev >= 0 ? ext(prev) : 0);
}
const PRESETS = [

function computeIds(){

/* pólusok nevei és színei (L1, L2, L3, N, PE) */
function poleNames(c){
  const P = c.poles, ph3 = POLES[P] && POLES[P].ph === 3;
  if (c.type === 'terminal') return P === '1P' ? [c.tcol || 'L', c.tcol || 'L'] : ph3 ? ['L1', 'L2', 'L3', 'N'].concat(P === '3P+N+PE' ? ['PE'] : []) : ['L', 'N'];
  if (ph3) return ['L1', 'L2', 'L3'].concat(/N|4P/.test(P) ? ['N'] : []);
  if (P === '1P+N' || P === '2P') return c.nLeft ? ['N', 'L'] : ['L', 'N'];

}
const POLE_COL = {L1:'#7a4a1e', L2:'#1c1c1c', L3:'#8a8f95', L:'#7a4a1e', N:'#2d6fd3', PE:'gy'};
const poleCol = (c, p) => POLE_COL[poleNames(c)[p]] || null;
const wireCol = w => { if (w.color) return w.color; const a = byId(w.a.c), b = byId(w.b.c); return (w.a.p != null && poleCol(a, w.a.p)) || (w.b.p != null && poleCol(b, w.b.p)) || null; };
/* a pólusok csavarpontjának x helye az eszközön (i. pólus) */
function polePx(c, i){
  const w = mods(c) * MOD_W;
  if (c.type === 'terminal') return c.poles === '1P' ? devX(c) + TERM_W * (i ? .75 : .25) : devX(c) + (i + .5) * TERM_W; // az egy kapcsos sorkapocs lapjának két csavarjánál

function screwY(c, side){ return side === 'top' ? rowTop(c.row) + 8 : rowTop(c.row) + DEV_H - 8; }
// háromfázisú vezeték: három külön ér, mindegyik a saját pólus csavarpontjához köt (barna, fekete, szürke)
function triPath(pts, ends, i){
  const off = offsetPoly(pts, [-4.5, 0, 4.5][i]), n = off.length;

  const a = ends[0], b = ends[1], dist = 12 + (2 - i) * 4;

/* párhuzamos eltolás (derékszögű vonalláncokhoz): a háromfázisú vezeték három külön erű kábelként rajzolódik */
function offsetPoly(pts, d){
  const p = pts.filter((q, i) => i === 0 || Math.hypot(q.x - pts[i - 1].x, q.y - pts[i - 1].y) > .01);
  if (p.length < 2) return pts;

    const k = d / (1 + dot);
    out.push({x:p[i].x + (a.x + b.x) * k, y:p[i].y + (a.y + b.y) * k});
  }

function rpath(pts, r){
  r = r || 6;
  pts = pts.filter((q, i) => i === 0 || Math.hypot(q.x - pts[i - 1].x, q.y - pts[i - 1].y) > .5); // az egymásra eső pontokat kiszűri (nincs átlós szakasz)
  if (pts.length < 2) return `M${pts[0].x},${pts[0].y}`;
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    const l1 = Math.hypot(p1.x - p0.x, p1.y - p0.y), l2 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    if (l1 < .5 || l2 < .5) continue;
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const a = {x:p1.x - (p1.x - p0.x) / l1 * rr, y:p1.y - (p1.y - p0.y) / l1 * rr};
    const b = {x:p1.x + (p2.x - p1.x) / l2 * rr, y:p1.y + (p2.y - p1.y) / l2 * rr};
    d += ` L${a.x},${a.y} Q${p1.x},${p1.y} ${b.x},${b.y}`;

/* kézi útvonal-eltolás: a vezeték belső szakaszai (az első és az utolsó kivételével) merőlegesen eltolhatók (w.off[i]) */
function applyOff(pts, w){
  if (!w || !w.off) return pts;

/* a vezetékek ne takarják egymást: az egymásra eső, párhuzamos belső szakaszokat széthúzza */
function separateWires(items){
  const G = .4, STEP = 1.2;

    let changed = false;
    [true, false].forEach(horiz => {
      const segs = [];
      items.forEach((it, ii) => {
        const p = it.pts;
        for (let i = 0; i < p.length - 1; i++) {
          const a = p[i], b = p[i + 1], h = Math.abs(a.y - b.y) < .01, v = Math.abs(a.x - b.x) < .01;
          if (horiz ? (h && !v) : (v && !h)) segs.push({ii, i, mv:!it.frozen && i >= 1 && i <= p.length - 3});
        }

      segs.filter(s => s.mv).sort((s, t) => geo(s).c - geo(t).c || s.ii - t.ii || s.i - t.i).forEach(s => {
        const g = geo(s), hw = items[s.ii].hw;
        const clash = c => placed.some(o => { if (o.ii === s.ii) return false; const go = geo(o); return Math.abs(go.c - c) < hw + items[o.ii].hw + G && Math.min(go.hi, g.hi) - Math.max(go.lo, g.lo) > 2; });

        for (let k = 0; k < 80 && best == null; k++) for (const sg of (k ? [1, -1] : [0])) { const c = g.c + sg * k * STEP; if (!clash(c)) { best = c; break; } }

          if (horiz) { p[s.i].y = best; p[s.i + 1].y = best; } else { p[s.i].x = best; p[s.i + 1].x = best; }

        }
        placed.push(s);

    else if (a === 'restore') { try { load(JSON.parse(localStorage.getItem(b.getAttribute('data-k'))), afterLoad); closeModal(); toast('Visszaállítva'); } catch (er) { toast('A mentés nem olvasható'); } }
    else if (a === 'srvload') srvLoadFile().then(projectModal);
    else if (a === 'srvover') srvOverwrite().then(projectModal);
    else if (a === 'autolink') linkFile().then(projectModal);
    else if (a === 'resume') resumeLinked().then(projectModal);
    else if (a === 'unlink') unlinkFile().then(projectModal);
    else if (a === 'demo') { demo(); closeModal(); afterLoad(); toast('Minta betöltve'); }
    else if (a === 'restore-standalone') {
      if (!confirm('A korábbi önálló elosztótervet betöltöd ebbe a projektbe? Ez a jelenlegi elosztórajzot lecseréli. A korábbi önálló mentés megmarad.')) return;
      try {
        const raw = localStorage.getItem(STORE_KEY); if (!raw) throw new Error('missing');
        const saved = JSON.parse(raw);
        // Bindings belong to their original host project, never to this one.
        if (Array.isArray(saved.comps)) saved.comps.forEach(comp => { if (comp && typeof comp === 'object') { delete comp.vgCircuitId; delete comp.vgCreate; } });
        load(saved, () => { ensureEmbeddedImportPreserved(saved); afterLoad(); }); closeModal(); toast('A korábbi elosztóterv átvéve');
      } catch (error) { toast('A korábbi elosztóterv nem olvasható'); }
    }
    else if (a === 'new') { if (confirm(embedded ? 'Biztosan törlöd a jelenlegi elosztórajzot?' : 'Biztosan törlöd az egész tervet?')) { S.project = {name:'Új projekt', author:'', date:today(), demand:1}; S.rows = [{mods:18,bar:'',box:0},{mods:18,bar:'',box:0}]; S.boxes = [newBox('Elosztó')]; S.comps = []; S.wires = []; S.bw = []; S.bb = []; S.stubs = []; S.nid = 1; closeModal(); afterLoad(); } }
    else if (a === 'paste') { try { loadUserProject(JSON.parse($('#p-paste').value)); closeModal(); toast('Betöltve'); } catch (er) { toast('Érvénytelen adat'); } }
  });
  $('#filekmsz').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const msg = importKmsz(JSON.parse(rd.result)); closeModal(); toast('KMSZ-ek cserélve: ' + msg); } catch (er) { toast(er.message === 'nobox' ? 'A fájlban megadott doboz nincs a projektben' : 'Érvénytelen KMSZ-fájl'); } };
    rd.readAsText(f); e.target.value = '';
  });
  $('#filein').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { loadUserProject(JSON.parse(rd.result)); closeModal(); toast('Betöltve'); } catch (er) { toast(embedded ? 'Érvénytelen vagy hiányos elosztóterv' : 'Érvénytelen fájl'); } };
    rd.readAsText(f); e.target.value = '';
  });
}

/* ───────────── minta ───────────── */
function demo(){
  S.nid = 1; S.comps = []; S.wires = []; S.bw = []; S.bb = []; S.stubs = []; S.boxes = [newBox('Elosztó')]; S.boxes[0].bus = {n:12, pe:12}; S.rows = [{mods:18,bar:'',box:0},{mods:18,bar:'',box:0},{mods:18,bar:'',box:0}];
  S.project = {name:'Lakáselosztó – minta', author:'', date:today(), demand:1};
  const mk = (type, row, x, o) => Object.assign({id:'c' + (S.nid++), type, row, x}, DEF[type](), o || {});
  const T = mk('supply', 0, 0), Q = mk('main', 0, 4), SP = mk('spd', 0, 8), FI = mk('rccb', 0, 12, {name:'ÁVK – lakás'});
  const m = [
    mk('mcb', 1, 0, {rating:10, name:'Világítás', cable:'NYM-J 3×1,5 mm²', loadType:'lamp', power:600}),
    mk('mcb', 1, 1, {name:'Nappali dugalj', power:2300}),
    mk('mcb', 1, 2, {name:'Hálószobák dugalj', power:2300}),
    mk('mcb', 1, 3, {name:'Konyha dugalj', power:3000}),
    mk('rcbo', 1, 4, {name:'Mosógép', power:2200}),
    mk('mcb', 1, 6, {poles:'3P', rating:20, name:'Indukciós főzőlap', cable:'NYM-J 5×2,5 mm²', loadType:'other', power:7400}),
    mk('mcb', 1, 9, {rating:10, name:'Kazán', cable:'NYM-J 3×1,5 mm²', loadType:'other', power:150})
  ];
  S.comps.push(T, Q, SP, FI, ...m);
  const E = (c, s) => (poleNames(c).length > 1 ? {c:c.id, s, p:0} : {c:c.id, s}); // több pólusú eszköznél az első pólusra
  const W = (a, as, b, bs) => S.wires.push({id:'w' + (S.nid++), a:E(a, as), b:E(b, bs)});
  W(T, 'bottom', Q, 'top'); W(Q, 'bottom', SP, 'top'); W(Q, 'bottom', FI, 'top');
  m.forEach(d => W(FI, 'bottom', d, 'top'));
  S.boxes[0].bu = {n:['Betáp'].concat(m.map(d => d.name)), pe:['Betáp'].concat(m.map(d => d.name))};
  S.sel = null; S.pending = null;
}

/* ───────────── nézet, vezérlők ───────────── */
function updHint(){
  const h = $('#hint');
  if (S.pending && S.pending.bdot) {
    h.innerHTML = `Kiindulás: <b>${esc(BUS[S.pending.bus].label)} ${S.pending.k + 1}. kapocs</b> – koppints egy eszköz felső vagy alsó pontjára (ugyanabban a dobozban).`;
  } else if (S.pending && S.pending.rowbar != null) {
    h.innerHTML = `Kiindulás: <b>${esc(S.rows[S.pending.rowbar].bar)} sín (${S.pending.rowbar + 1}. sor)</b> – koppints egy eszköz alsó (bemeneti) pontjára ugyanebben a sorban.`;
  } else if (S.pending) {
    const P = S.pending, has = (S.stubs || []).some(x => x.c === P.c && x.s === P.s && (x.p == null ? null : x.p) === (P.p == null ? null : P.p));
    h.innerHTML = `Kiindulás: <b>${esc(S.ids[P.c] || '')} ${P.s === 'top' ? 'felső' : 'alsó'} pont</b> – koppints a másik eszköz pontjára, vagy <button class="btn" data-hint="stub">${has ? 'Kimenő csonk törlése innen' : 'Kimenő csonk ide'}</button> Háttér vagy ugyanaz a pont: mégse.`;
  } else if (!S.comps.length) h.textContent = 'Koppints a fenti sávban egy eszközre, hogy az első szabad helyre kerüljön.';
  else h.textContent = 'Vezeték: koppints egy eszköz felső vagy alsó pontjára, majd egy másikéra. Mozgatás: jelöld ki az eszközt, majd húzd.';
}
function render(){
  renderCab(); renderInsp(); renderSldIf(); updHint(); updUndo(); saveSoon();
  if (S._mig) { const m = S._mig; S._mig = null; toast(m); }
  $('#selmods').value = String(S.rows[Math.min(S.activeRow, S.rows.length - 1)].mods);
  $('#btn-cont').classList.toggle('on', S.cont);
}
function fitCab(){
  const wrap = $('#cabwrap'), maxMods = Math.max.apply(null, S.rows.map(r => r.mods));
  const W = LM + maxMods * MOD_W + RM;
  S.zoom = Math.max(.55, Math.min(1.1, (wrap.clientWidth - 4) / W));
  renderCab();
}
function fitSld(){
  const wrap = $('#sldwrap'), sz = S.sldSize || buildSLD();
  S.sldZoom = Math.max(.3, Math.min(1.4, (wrap.clientWidth - 24) / sz.w));
  renderSld();
}
function setView(v){
  S.view = v;
  $('#view-cab').hidden = v !== 'cab'; $('#view-sld').hidden = v !== 'sld';
  document.querySelectorAll('.tab').forEach(t => { const on = t.getAttribute('data-view') === v; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });
  if (v === 'sld') { renderSld(); if (!S.sldFitted) { S.sldFitted = true; fitSld(); } }
}
function init(){
  if (embedded) $('#btn-proj').textContent = 'Elosztóterv';
  // paletta
  $('#palette').innerHTML = PRESETS.map(p => `<button class="pal" data-add="${p.key}" aria-label="${esc(p.label)} hozzáadása">${thumb(p)}<span>${esc(p.label)}</span></button>`).join('');
  $('#palette').addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (b) addComp(b.getAttribute('data-add')); });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setView(t.getAttribute('data-view'))));
  $('#btn-undo').onclick = undo;
  $('#btn-check').onclick = showChecks;
  $('#btn-proj').onclick = projectModal;
  $('#pname').addEventListener('input', e => { S.project.name = e.target.value; renderSldIf(); saveSoon(); });
  const actRow = () => Math.min(S.activeRow, S.rows.length - 1);
  const shiftRows = (from, d) => { S.comps.forEach(c => { if (c.row >= from) c.row += d; }); };
  $('#btn-rowadd').onclick = () => {
    const ri = actRow(), box = S.rows[ri].box;
    let at = ri; while (at + 1 < S.rows.length && S.rows[at + 1].box === box) at++;
    snap(); shiftRows(at + 1, 1);
    S.rows.splice(at + 1, 0, {mods:S.rows[ri].mods, bar:'', box}); S.activeRow = at + 1; render();
  };
  $('#btn-rowdel').onclick = () => {
    if (S.rows.length <= 1) return;
    const ri = actRow(), box = S.rows[ri].box;
    if (S.comps.some(c => c.row === ri)) { toast('Az aktív sorban még vannak eszközök'); return; }
    snap(); shiftRows(ri + 1, -1);
    S.bw = S.bw.filter(w => byId(w.c));
    S.rows.splice(ri, 1);
    if (!S.rows.some(r => r.box === box) && S.boxes.length > 1) { S.boxes.splice(box, 1); S.rows.forEach(r => { if (r.box > box) r.box--; }); }
    S.activeRow = Math.min(ri, S.rows.length - 1); render();
  };
  $('#btn-boxadd').onclick = () => {
    let nm = 'Új elosztó'; try { nm = prompt('Az új elosztó doboz neve:', 'Új elosztó'); } catch (e) {}
    if (nm == null) return;
    snap(); S.boxes.push(newBox(nm.trim() || 'Új elosztó'));
    S.rows.push({mods:18, bar:'', box:S.boxes.length - 1}); S.activeRow = S.rows.length - 1; render();
    try { $('#cabwrap').scrollTo({top:1e6, behavior:'smooth'}); } catch (e) {}
  };
  $('#btn-boxren').onclick = () => {
    const bx = S.boxes[S.rows[actRow()].box]; let nm = null;
    try { nm = prompt('Az elosztó doboz neve:', bx.name); } catch (e) {}
    if (nm == null || !nm.trim()) return;
    snap(); bx.name = nm.trim(); render();
  };
  $('#selmods').onchange = e => {
    const n = Number(e.target.value), ri = Math.min(S.activeRow, S.rows.length - 1), box = S.rows[ri].box;
    const idx = S.rows.map((r, i) => i).filter(i => S.rows[i].box === box);
    if (S.comps.some(c => idx.includes(c.row) && c.x + mods(c) > n + 1e-6)) { toast('Ennyi modulba nem férnek bele az eszközök'); e.target.value = S.rows[ri].mods; return; }
    snap(); idx.forEach(i => { S.rows[i].mods = n; if (S.rows[i].barN) S.rows[i].barN = Math.min(S.rows[i].barN, n); }); render(); fitCab(); toast(S.boxes[box].name + ': ' + n + ' modul (mind a ' + idx.length + ' sor)');
  };
  $('#btn-zin').onclick = () => { S.zoom = Math.min(2, S.zoom * 1.2); renderCab(); };
  $('#btn-zout').onclick = () => { S.zoom = Math.max(.3, S.zoom / 1.2); renderCab(); };
  $('#btn-zfit').onclick = fitCab;
  $('#btn-cont').onclick = () => { S.cont = !S.cont; S.pending = null; render(); toast(S.cont ? 'Folyamatos bekötés: a kiindulási pont megmarad' : 'Folyamatos bekötés kikapcsolva'); };
  $('#btn-szin').onclick = () => { S.sldZoom = Math.min(3, S.sldZoom * 1.25); renderSld(); };
  $('#btn-szout').onclick = () => { S.sldZoom = Math.max(.2, S.sldZoom / 1.25); renderSld(); };
  $('#btn-szfit').onclick = fitSld;
  document.querySelectorAll('.paper').forEach(sel => {
    sel.innerHTML = '<option value="raw">Eredeti méret</option>' + Object.keys(PAPERS).map(k => `<option value="${k}">${PAPERS[k].n}</option>`).join('');
    sel.value = S.paper;
    sel.onchange = () => { S.paper = sel.value; document.querySelectorAll('.paper').forEach(o => { o.value = S.paper; }); try { localStorage.setItem('eloszto-tervezo-paper', S.paper); } catch (e) {} };
  });
  $('#btn-svg').onclick = () => saveFile(slug(S.project.name) + '-egyvonalas' + (PAPERS[S.paper] ? '-' + S.paper : '') + '.svg', paperPage(sldExport()).svg, null);
  $('#btn-png').onclick = () => savePng();
  $('#btn-print').onclick = () => { renderSld(); printView('sld', sldExport()); window.print(); };
  $('#btn-csvg').onclick = () => saveFile(slug(S.project.name) + '-szekreny' + (PAPERS[S.paper] ? '-' + S.paper : '') + '.svg', paperPage(cabSvgString()).svg, null);
  $('#btn-cpng').onclick = () => savePng('cab');
  $('#btn-cprint').onclick = () => {
    const sel = S.sel, pend = S.pending; S.sel = null; S.pending = null; renderCab();
    printView('cab', cabSvgString());
    const done = () => { document.body.classList.remove('pcab'); S.sel = sel; S.pending = pend; renderCab(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done); window.print();
  };
  $('#btn-phase').onclick = assignPhases;
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''));
    if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (S.pending) { S.pending = null; render(); } }
    if (typing) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel && S.view === 'cab') {
      e.preventDefault();
      if (S.sel.kind === 'c') delComp(S.sel.id); else if (S.sel.kind === 'b') delBus(S.sel.id); else delWire(S.sel.id);
    }
    const dir = {ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1]}[e.key];
    if (dir && S.sel && S.sel.kind === 'c' && S.view === 'cab' && $('#modal').hidden) {
      const c = byId(S.sel.id);
      if (c) {
        e.preventDefault();
        const row = Math.max(0, Math.min(S.rows.length - 1, c.row + dir[1])), x = c.x + dir[0];
        if (free(row, x, mods(c), c.id)) { snap(); c.row = row; c.x = x; S.activeRow = row; render(); }
      }
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });
  initCabEvents(); initInsp(); initModal();
  let loaded = false;
  let raw = null;
  if (!embedded) try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (raw) {
    try { load(JSON.parse(raw)); loaded = true; }
    catch (e) {
      try { localStorage.setItem(STORE_KEY + '-hibas-mentes', raw); } catch (er) {}
      toast('A mentett adat sérült, minta töltődött (a régi: ' + STORE_KEY + '-hibas-mentes)');
    }
  }
  if (!loaded) { if (embedded) clearEmbeddedProject('Elosztó'); else demo(); }
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
  $('#pname').value = S.project.name;
  render(); fitCab();
  if (!embedded) restoreLinked().then(() => {
    if (fh && !fhOn) { toast('Automatikus fájlmentés: kattints bárhová az engedély megadásához (' + fh.name + ')'); document.addEventListener('pointerdown', () => { if (fh && !fhOn) resumeLinked().then(() => { if ($('#modal').hidden === false && /^Projekt/.test($('#mtitle').textContent)) projectModal(); }); }, {once:true}); }
    else if (!fh && FS_OK) toast('Tipp: Projekt → Automatikus mentés fájlba – így a változtatásaid a projekt fájlba is mentődnek');
  });
}
window.__eloszto = {separateWires, allCoresOne, importKmsz, S, buildSLD, runChecks, addComp, handleTerm, renderCab, demo, render, load, data};
init();
if (embedded) {
  window.addEventListener('message', onHostMessage);
  window.parent.postMessage({type:'voltgecko:ready'}, location.origin);
}
})();
</script>
</body>
</html>
